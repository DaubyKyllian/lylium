<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
  <symbol id="fleur" viewBox="-50 -50 100 100" overflow="visible">
  <path d="M0,-44 Q3.5,-31 10,-25 Q3.5,-19 0,-5 Q-3.5,-19 -10,-25 Q-3.5,-31 0,-44Z"/>
  <path d="M-1.4,-8 L1.4,-8 L0.9,44 L-0.9,44Z"/>
  <path d="M1.5,44 C1,14 18,-11 46,-9 C31,-4 11,12 1.5,44Z"/>
  <path d="M-1.5,44 C-1,14 -18,-11 -46,-9 C-31,-4 -11,12 -1.5,44Z"/>
</symbol>
<symbol id="etoile" viewBox="-15 -15 30 30" overflow="visible">
  <path d="M0,-14 Q1.8,-2 9.5,0 Q1.8,2 0,14 Q-1.8,2 -9.5,0 Q-1.8,-2 0,-14Z"/>
</symbol>
<symbol id="flamme" viewBox="-15 -25 30 50" overflow="visible">
  <path d="M3,-23 C11,-14 10,-3 3,5 C-1,10 -4,16 -3,23 C-9,15 -9,6 -2,-2 C3,-8 5,-15 3,-23Z"/>
</symbol>

  <pattern id="monogram" width="261" height="336" patternUnits="userSpaceOnUse" patternTransform="scale(.34) translate(40 150)">
    <rect width="261" height="336" fill="#0e0c32"/>
    <g fill="#f7bb57"><g>
  <use href="#etoile" x="28" y="12" width="30" height="30"/>
  <use href="#flamme" x="157" y="2" width="30" height="50"/>
  <use href="#flamme" x="28" y="125" width="30" height="50"/>
  <use href="#fleur" x="129" y="100" width="86" height="86"/>
  <use href="#fleur" x="0" y="226" width="86" height="86"/>
  <use href="#etoile" x="157" y="222" width="30" height="30"/>
  <use href="#fleur" x="261" y="226" width="86" height="86"/>
  <use href="#fleur" x="-261" y="226" width="86" height="86"/>
</g>
</g>
  </pattern>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe2a3"/><stop offset=".45" stop-color="#f7bb57"/>
    <stop offset="1" stop-color="#c98f35"/>
  </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".38" r=".8">
      <stop offset="0" stop-color="#f6f1e8"/><stop offset="1" stop-color="#d9cfbf"/>
    </radialGradient>
    <linearGradient id="lightFront" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="lightV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/>
      <stop offset=".12" stop-color="#000" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07061c"/><stop offset=".5" stop-color="#2a2766"/><stop offset="1" stop-color="#07061c"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1950"/><stop offset="1" stop-color="#03020f"/>
    </linearGradient>
    <linearGradient id="tissue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7bd"/><stop offset=".5" stop-color="#f0cf8a"/><stop offset="1" stop-color="#d9ad5f"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="frontClip"><rect x="470" y="400" width="540" height="660"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <!-- ombre au sol -->
  <ellipse cx="800" cy="1068" rx="400" ry="34" fill="#000" opacity=".28" filter="url(#blur)"/>
  <path d="M1120,1030 L1270,1070 L1010,1072Z" fill="#000" opacity=".12" filter="url(#blur)"/>

  <!-- anse arrière (fixée sur le panneau arrière) -->
  <path d="M765,380 C765,120 955,120 955,380"
        fill="none" stroke="#06051a" stroke-width="15" stroke-linecap="round"/>
  <!-- ouverture du sac : intérieur + papier de soie -->
  <path d="M470,400 L590,370 L1130,370 L1010,400Z" fill="#05041a"/>
  <path d="M590,370 L1130,370 L1010,400 L470,400Z" fill="url(#interior)"/>
  <g filter="url(#emboss)">
    <path d="M530,400 L620,280 L685,345 L770,250 L800,360 L890,295 L900,400Z" fill="url(#tissue)"/>
    <path d="M770,250 L750,400" stroke="#b98a3e" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M620,280 L645,400" stroke="#b98a3e" stroke-opacity=".35" stroke-width="1.5"/>
  </g>
  <!-- soufflet latéral -->
  <g>
    <path d="M1010,400 L1130,370 L1130,1030 L1010,1060Z" fill="url(#monogram)"/>
    <path d="M1010,400 L1130,370 L1130,1030 L1010,1060Z" fill="#000" opacity=".42"/>
    <path d="M1010,400 L1070,440 L1130,370" fill="#000" opacity=".35"/>
    <path d="M1070,440 L1070,980" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
    <path d="M1010,1060 L1070,980 L1130,1030" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
    <path d="M1010,400 L1130,370" stroke="#f7bb57" stroke-opacity=".5" stroke-width="1.5"/>
  </g>

  <!-- face avant -->
  <g clip-path="url(#frontClip)">
    <rect x="470" y="400" width="540" height="660" fill="url(#monogram)"/>
    <!-- revers du haut -->
    <rect x="470" y="400" width="540" height="46" fill="#0e0c32"/>
    <line x1="470" x2="1010" y1="446" y2="446" stroke="url(#gold)" stroke-width="3"/>
    <line x1="470" x2="1010" y1="1026" y2="1026" stroke="url(#gold)" stroke-width="2"/>

    <!-- cartouche -->
    <g transform="translate(740 760)">
      <rect x="-165" y="-92" width="330" height="184" rx="6" fill="#0e0c32"/>
      <rect x="-165" y="-92" width="330" height="184" rx="6" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <rect x="-154" y="-81" width="308" height="162" rx="3" fill="none" stroke="url(#gold)" stroke-width="1"/>
      <g filter="url(#emboss)" fill="url(#gold)">
        <use href="#fleur" x="-26" y="-74" width="52" height="52"/>
        <text x="0" y="34" text-anchor="middle" font-family="'Cormorant Garamond', 'Liberation Serif', serif"
              font-size="52" font-weight="600" letter-spacing="14">LYLIUM</text>
        <text x="7" y="64" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', sans-serif"
              font-size="11" letter-spacing="6">MAISON FRANÇAISE</text>
      </g>
    </g>

    <rect x="470" y="400" width="540" height="660" fill="url(#lightFront)"/>
    <rect x="470" y="400" width="540" height="660" fill="url(#lightV)"/>
    <!-- léger pli vertical du papier -->
    <rect x="804.8" y="400" width="60" height="660" fill="#fff" opacity=".035"/>
  </g>
  <rect x="470" y="400" width="540" height="660" fill="none" stroke="#000" stroke-opacity=".4"/>

  <!-- anse avant : ruban satin + œillets dorés -->
  <path d="M645,424 C645,160 835,160 835,424"
        fill="none" stroke="#000" stroke-opacity=".3" stroke-width="18" stroke-linecap="round" filter="url(#soft)" transform="translate(4 6)"/>
  <path d="M645,424 C645,160 835,160 835,424"
        fill="none" stroke="#0e0c32" stroke-width="16" stroke-linecap="round"/>
  <path d="M645,424 C645,160 835,160 835,424"
        fill="none" stroke="#3a3690" stroke-opacity=".7" stroke-width="3" transform="translate(-3 -2)"/>
  
  <circle cx="645" cy="424" r="13" fill="url(#gold)"/>
  <circle cx="645" cy="424" r="7.5" fill="#05041a"/>
  <circle cx="645" cy="424" r="13" fill="none" stroke="#c98f35" stroke-width="1"/>
  <circle cx="835" cy="424" r="13" fill="url(#gold)"/>
  <circle cx="835" cy="424" r="7.5" fill="#05041a"/>
  <circle cx="835" cy="424" r="13" fill="none" stroke="#c98f35" stroke-width="1"/>

  <!-- légende -->
  <g font-family="'Cormorant Garamond','Liberation Serif',serif" fill="#0e0c32">
    <text x="90" y="120" font-size="44" font-weight="600" letter-spacing="10">LYLIUM</text>
    <text x="92" y="152" font-family="'Inter','DejaVu Sans',sans-serif" font-size="13" letter-spacing="4" opacity=".7">SAC SHOPPING PREMIUM — MONOGRAMME FLEUR DE LYS</text>
    <g font-family="'Inter','DejaVu Sans',sans-serif" font-size="13" letter-spacing="1.5">
      <rect x="90" y="1050" width="34" height="34" fill="#0e0c32"/><text x="134" y="1072">Bleu nuit #0E0C32</text>
      <rect x="300" y="1050" width="34" height="34" fill="#f7bb57"/><text x="344" y="1072">Or #F7BB57 (dorure à chaud)</text>
    </g>
  </g>
</svg>